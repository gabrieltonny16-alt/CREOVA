<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914">
<title>Continue to CREOVA</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#070914;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.panel{width:min(520px,100%);padding:34px;border:1px solid #263653;border-radius:24px;background:#10172a;text-align:center}.brand{font-weight:900;letter-spacing:.18em;font-size:24px}.brand span{color:#00d2ff}.symbol{margin:26px auto 18px;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#00d2ff,#2868ff,#d926ef);display:grid;place-items:center;font-size:34px;font-weight:900}.muted{color:#aab4ca;line-height:1.65}.btn{display:inline-block;margin-top:20px;padding:14px 22px;border-radius:12px;background:linear-gradient(100deg,#087fe8,#5548ee 65%,#bd28df);color:#fff;text-decoration:none;font-weight:800}.small{font-size:12px;color:#8290aa;margin-top:22px}
</style>
</head>
<body><main class="panel"><div class="brand">CREO<span>V</span>A</div><div class="symbol">C</div><h1>Continue to CREOVA</h1><p class="muted" id="message">Your email link has brought you to CREOVA. Open the app to continue. If the app does not open, return to it manually.</p><a class="btn" id="openApp" href="#">Open CREOVA app</a><p class="small">If you did not request this email, you can safely close this page.</p></main>
<script>
(function(){
 const params=window.location.search;
 const hash=window.location.hash;
 const deepLink='creova://auth/callback'+params+hash;
 document.getElementById('openApp').href=deepLink;
 const p=new URLSearchParams(params);
 if(p.has('error_description')) document.getElementById('message').textContent='This verification link could not be completed. Return to CREOVA and request a new verification email.';
 else if(p.has('code')||p.has('token_hash')||hash.includes('access_token')) document.getElementById('message').textContent='Your email link was received. Open the CREOVA app to finish signing in.';
})();
</script></body></html>
