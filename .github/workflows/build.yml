name: CREOVA feature build
on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creova-build-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: creova-feature-build
          path: dist
          retention-days: 7
          if-no-files-found: error
