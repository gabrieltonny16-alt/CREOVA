name: CREOVA Android development build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creova-android-development-build
  cancel-in-progress: false

jobs:
  android-development-build:
    name: Build CREOVA development APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out CREOVA
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start Android development build
        run: eas build --platform android --profile development --non-interactive --no-wait
