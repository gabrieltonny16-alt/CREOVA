name: CREOVA Android APK

on:
  push:
    branches:
      - rebuild/fresh-social-platform
    paths:
      - .github/workflows/android-apk.yml
      - .github/workflows/ci.yml
      - App.tsx
      - app.json
      - eas.json
      - package.json
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out CREOVA
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: creova-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
