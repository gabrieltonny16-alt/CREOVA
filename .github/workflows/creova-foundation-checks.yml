name: CREOVA foundation checks and preview

on:
  push:
    branches:
      - creova/clean-foundation
  pull_request:
    branches:
      - creova/clean-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creova-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, validate and export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Export web build
        run: npx expo export --platform web --base-url /CREOVA/

      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: creova-web-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-preview:
    if: github.event_name != 'pull_request'
    needs: validate
    name: Deploy temporary web preview
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
